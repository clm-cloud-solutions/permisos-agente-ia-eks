# Un rol de base de datos por API, con el mínimo privilegio y conexiones limitadas:
#
#   orders_app   SELECT sobre orders    (CONNECTION LIMIT 10)
#   catalog_app  SELECT sobre products  (CONNECTION LIMIT 10)
#
# Corre como el administrador (shop-db-credentials). Las contraseñas de los roles
# salen de orders-db-credentials (la que sincroniza External Secrets) y de
# catalog-db-credentials. Idempotente: crea los roles si faltan y reaplica
# contraseñas y permisos.
apiVersion: batch/v1
kind: Job
metadata:
  name: shop-db-app-roles
  namespace: shop-backend
  labels:
    app.kubernetes.io/part-of: kubeshop
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: psql
          image: public.ecr.aws/docker/library/postgres:16-alpine
          env:
            - name: PGHOST
              valueFrom: {configMapKeyRef: {name: shop-db, key: host}}
            - name: PGDATABASE
              value: shop
            - name: PGSSLMODE
              valueFrom: {configMapKeyRef: {name: shop-db, key: sslmode}}
            - name: PGSSLROOTCERT
              value: /etc/db-ca/bundle.pem
            - name: PGUSER
              valueFrom:
                secretKeyRef: {name: shop-db-credentials, key: username}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: shop-db-credentials, key: password}
            - name: ORDERS_PW
              valueFrom:
                secretKeyRef: {name: orders-db-credentials, key: password}
            - name: CATALOG_PW
              valueFrom:
                secretKeyRef: {name: catalog-db-credentials, key: password}
          command: ["sh", "-c"]
          args:
            - |
              psql -v ON_ERROR_STOP=1 -v orders_pw="$ORDERS_PW" -v catalog_pw="$CATALOG_PW" <<'SQL'
              -- dollar-quote con nombre: Kubernetes convierte "$$" en "$" en los args
              DO $do$
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'orders_app') THEN
                  CREATE ROLE orders_app LOGIN;
                END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'catalog_app') THEN
                  CREATE ROLE catalog_app LOGIN;
                END IF;
              END $do$;
              ALTER ROLE orders_app  LOGIN CONNECTION LIMIT 10 PASSWORD :'orders_pw';
              ALTER ROLE catalog_app LOGIN CONNECTION LIMIT 10 PASSWORD :'catalog_pw';
              GRANT CONNECT ON DATABASE shop TO orders_app, catalog_app;
              GRANT USAGE ON SCHEMA public TO orders_app, catalog_app;
              GRANT SELECT ON orders   TO orders_app;
              GRANT SELECT ON products TO catalog_app;
              SELECT rolname, rolconnlimit FROM pg_roles
              WHERE rolname IN ('orders_app', 'catalog_app') ORDER BY 1;
              SQL
          volumeMounts:
            - {name: db-ca, mountPath: /etc/db-ca, readOnly: true}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
      volumes:
        - {name: db-ca, configMap: {name: db-ca}}
