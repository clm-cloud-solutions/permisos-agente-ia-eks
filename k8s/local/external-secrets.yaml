# Local: el namespace «boveda» hace de Secrets Manager. Su Secret orders-db es la
# fuente de verdad de la contraseña de orders-api, y External Secrets la copia a
# shop-backend/orders-db-credentials cada minuto, igual que en AWS. Lee con la
# ServiceAccount eso-boveda, que solo puede leer Secrets de ese namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: boveda
  labels: {app.kubernetes.io/part-of: kubeshop}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: eso-boveda, namespace: boveda}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: leer-secretos, namespace: boveda}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectrulesreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: eso-boveda, namespace: boveda}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: leer-secretos}
subjects:
  - {kind: ServiceAccount, name: eso-boveda, namespace: boveda}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: secretos
spec:
  provider:
    kubernetes:
      remoteNamespace: boveda
      server:
        caProvider: {type: ConfigMap, name: kube-root-ca.crt, key: ca.crt, namespace: boveda}
      auth:
        serviceAccount: {name: eso-boveda, namespace: boveda}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orders-db-credentials
  namespace: shop-backend
  labels: {app.kubernetes.io/part-of: kubeshop}
spec:
  refreshInterval: 1m
  secretStoreRef: {kind: ClusterSecretStore, name: secretos}
  target:
    name: orders-db-credentials
    creationPolicy: Owner
  dataFrom:
    - extract: {key: orders-db}
